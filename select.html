<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページ選択 | Asobi Lab. CMS</title>
  <link rel="stylesheet" href="src/css/pages/cms-common.css">
  <link rel="stylesheet" href="src/css/pages/cms-select.css">
</head>
<body class="cms-app cms-select-page">
  <div class="bg-mesh" aria-hidden="true"></div>

  <header class="cms-topbar">
    <a class="brand" href="index.html">🎮 Asobi Lab.</a>
    <div class="topbar-right">
      <span id="user-pill" class="user-pill">—</span>
      <button type="button" id="btn-logout" class="btn ghost">ログアウト</button>
    </div>
  </header>

  <main class="select-main">
    <header class="page-hero">
      <p class="eyebrow">Workspace</p>
      <h1>編集するページを選ぶ</h1>
      <p class="muted">フォームで内容を入力し、公開ページの決まった枠に反映します（インライン編集は使いません）。</p>
    </header>

    <nav class="seg-tabs" role="tablist">
      <button type="button" class="seg active" data-tab="pages">📄 ページ</button>
      <button type="button" class="seg" data-tab="files">📁 ファイル</button>
      <button type="button" class="seg" data-tab="help">❓ ヘルプ</button>
    </nav>

    <section id="panel-pages" class="panel">
      <div class="panel-toolbar">
        <p id="pages-status" class="status-line">読み込み中…</p>
        <button type="button" id="btn-refresh-pages" class="btn ghost sm">更新</button>
      </div>
      <div id="page-grid" class="page-grid"></div>
    </section>

    <section id="panel-files" class="panel hidden">
      <div class="panel-toolbar">
        <p class="status-line">個人フォルダ <code id="files-path">users/—/</code></p>
        <button type="button" id="btn-refresh-files" class="btn ghost sm">更新</button>
      </div>
      <p class="muted">GitHub 上の個人フォルダ一覧です。グループ添付は各グループ編集画面の「探求結果」から行います。</p>
      <div id="files-list" class="files-placeholder">タブを開くと読み込みます</div>
    </section>

    <section id="panel-help" class="panel hidden">
      <div class="help-card">
        <h2>編集の流れ</h2>
        <ol>
          <li>下のカードから<strong>個人ページ</strong>または<strong>グループページ</strong>を選ぶ</li>
          <li>フォームに入力して保存（JSON + 公開HTMLの両方）</li>
          <li>サイトを開いて反映を確認</li>
        </ol>
        <p class="muted">ロックされた見出し・メニュー・メンバー一覧は編集できません。</p>
      </div>
    </section>
  </main>

  <script src="src/js/cms/config.js"></script>
  <script src="src/js/cms/session.js"></script>
  <script src="src/js/cms/api.js"></script>
  <script src="src/js/cms/select.js"></script>
</body>
</html>
