<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンラインゲームを通じた英語学習の可能性 - Asobi Lab.</title>
  
  <!-- 直接リンク（一時的） -->
  <link rel="stylesheet" href="/asobiseminar/css/programmer.css?v=2026">
  
  <script src="/asobiseminar/js/load-css.js"></script>
  <script src="/asobiseminar/js/setThemeColor.js"></script>
</head>
<body>
  <main class="programmer-main">
    <section class="programmer-hero">
      <div class="programmer-hero-content">
        <h1 class="programmer-title">オンラインゲームを通じた英語学習の可能性</h1>
        <p class="programmer-subtitle">ゲーム内コミュニケーションを活用した言語習得の検証</p>
        <div class="programmer-tagline">
          <span class="programmer-tag">英語学習</span>
          <span class="programmer-tag">スピーキング</span>
          <span class="programmer-tag">リスニング</span>
          <span class="programmer-tag">実践検証</span>
        </div>
      </div>
    </section>

    <div class="programmer-container">
      <div class="programmer-mission">
        <h2>目標</h2>
        <p>オンラインゲームを通じた英語学習の可能性を検証する。</p>
        <p>勉強は楽しみながら進めたい、という前提に立ち、フォートナイトやエーペックスなどのゲーム内で外国人と英語で会話しながらプレイすることで、英語能力（特にスピーキングとリスニング）が向上するかを実践的に調べる。</p>
        <p>もし能力の向上が確認できれば、「楽しみながら学ぶ」学習の有効性を示す一つの事例となる。</p>
      </div>
    </div>
  </main>
</body>
