<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギャラリー - Asobi Lab.</title>
  <script src="/asobiseminar/js/load-css.js"></script>
  <script src="/asobiseminar/js/setThemeColor.js"></script>
</head>
<body>
  <main class="app-container">
    <header style="margin-bottom: 60px;">
      <h1 style="color: var(--main-color); font-size: clamp(2.2rem, 7vw, 3rem); font-weight: 900; text-shadow: 0 4px 12px rgba(0,0,0,0.3); letter-spacing: 0.05em; margin-bottom: 16px;">
        📸 ギャラリー
      </h1>
      <p style="opacity: 0.8; font-size: 1.1rem; margin: 0;">
        Asobi Lab. の活動を写真・映像でお届けします（写真はこれから増えます）
      </p>
    </header>

    <section style="margin-bottom: 60px;">
      <h2 class="asobi-section-title" style="font-size: 1.8rem; margin-bottom: 30px;">📷 活動風景</h2>

      <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 40px;">
        <div class="gallery-item" style="background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--main-color);">
          <div style="aspect-ratio: 1; background: linear-gradient(135deg, var(--main-color), var(--balance-color)); display: flex; align-items: center; justify-content: center; font-size: 4rem;">🖼️</div>
          <div style="padding: 16px;">
            <h3 style="color: var(--main-color); margin: 0 0 8px 0;">メンバー集合</h3>
            <p style="opacity: 0.7; margin: 0; font-size: 0.9rem;">チーム全体での活動風景</p>
          </div>
        </div>

        <div class="gallery-item" style="background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--main-color);">
          <div style="aspect-ratio: 1; background: linear-gradient(135deg, var(--balance-color), var(--variation-color)); display: flex; align-items: center; justify-content: center; font-size: 4rem;">🥢</div>
          <div style="padding: 16px;">
            <h3 style="color: var(--main-color); margin: 0 0 8px 0;">
              <a href="/asobiseminar/subpages/groups/two.html">建築チーム</a>の坊っちゃん
            </h3>
            <p style="opacity: 0.7; margin: 0; font-size: 0.9rem;">割り箸建築の途中経過</p>
          </div>
        </div>

        <div class="gallery-item" style="background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--main-color);">
          <div style="aspect-ratio: 1; background: linear-gradient(135deg, var(--variation-color), var(--main-color)); display: flex; align-items: center; justify-content: center; font-size: 4rem;">🛹</div>
          <div style="padding: 16px;">
            <h3 style="color: var(--main-color); margin: 0 0 8px 0;">スケボーチーム</h3>
            <p style="opacity: 0.7; margin: 0; font-size: 0.9rem;">練習中の様子</p>
          </div>
        </div>
      </div>

      <p style="text-align: center; opacity: 0.5; font-size: 0.9rem;">
        ※ 本物の写真が届き次第、ここがもっと賑やかになります
      </p>
    </section>

    <section style="text-align: center; margin-top: 40px; padding-top: 40px; border-top: 1px solid color-mix(in srgb, var(--main-color) 40%, transparent);">
      <p style="opacity: 0.7; margin-bottom: 16px;">更新されたコンテンツをチェック</p>
      <a href="/asobiseminar/index.html" class="asobi-btn">➔ ホームに戻る</a>
    </section>
  </main>
</body>
</html>
