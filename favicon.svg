<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#1a0a28"/>
    </linearGradient>
    <linearGradient id="orb" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="55%" stop-color="#00e6cc"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.35" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.9" stroke-dasharray="28 18" transform="rotate(-20 256 256)"/>
  <circle cx="256" cy="256" r="78" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="228" cy="228" r="28" fill="#ffffff" opacity="0.35"/>
  <text x="256" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="96" font-weight="900" fill="#0a0a14" opacity="0.92">A</text>
  <circle cx="256" cy="108" r="14" fill="#00ff88"/>
  <circle cx="392" cy="320" r="11" fill="#ff00aa"/>
  <circle cx="128" cy="300" r="9" fill="#00e6cc"/>
</svg>
