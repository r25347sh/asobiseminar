<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Asobi Lab.">
  <defs>
    <linearGradient id="g" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DFFB0"/>
      <stop offset="0.55" stop-color="#00D68F"/>
      <stop offset="1" stop-color="#00A8E8"/>
    </linearGradient>
    <linearGradient id="glow" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFD0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00A8E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect width="64" height="64" rx="14" fill="#0B1210"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- soft inner glow -->
  <circle cx="32" cy="30" r="22" fill="url(#glow)"/>

  <!-- stylized A (lab mark) -->
  <path
    d="M32 12.5
       L48.5 49.5
       H41.2
       L37.6 40.2
       H26.4
       L22.8 49.5
       H15.5
       L32 12.5Z
       M28.9 33.8
       H35.1
       L32 25.6
       L28.9 33.8Z"
    fill="url(#g)"
  />

  <!-- playful spark / experiment dot -->
  <circle cx="46.5" cy="16.5" r="3.2" fill="#E8F75A"/>
  <path
    d="M46.5 10.2 V12.4 M46.5 20.6 V22.8 M40.2 16.5 H42.4 M50.6 16.5 H52.8
       M42.1 12.1 L43.6 13.6 M49.4 19.4 L50.9 20.9
       M50.9 12.1 L49.4 13.6 M43.6 19.4 L42.1 20.9"
    stroke="#E8F75A"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- small baseline bar (lab bench hint) -->
  <rect x="18" y="52.2" width="28" height="2.4" rx="1.2" fill="url(#g)" opacity="0.85"/>
