<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編集 | Asobi Lab. CMS</title>
  <link rel="stylesheet" href="src/css/pages/cms-common.css">
  <link rel="stylesheet" href="src/css/pages/cms-editor.css">
</head>
<body class="cms-app cms-editor-page">
  <header class="cms-topbar">
    <div class="topbar-left">
      <button type="button" id="btn-back" class="btn ghost">← 戻る</button>
      <div class="ed-heading">
        <h1 id="ed-title">読み込み中…</h1>
        <p id="ed-path" class="mono muted">—</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="user-pill" class="user-pill">—</span>
      <button type="button" id="btn-logout" class="btn ghost">ログアウト</button>
    </div>
  </header>

  <main class="editor-main">
    <aside class="editor-side">
      <div class="side-card">
        <h2>保存</h2>
        <label class="field">
          <span>コミットメッセージ</span>
          <input id="commit-msg" placeholder="例: プロフィールを更新" required>
        </label>
        <button type="button" id="btn-save" class="btn primary block">保存する</button>
        <p id="save-status" class="status-line">フォーム入力後に保存できます</p>
        <p class="muted tiny">保存時は JSON と公開 HTML の両方を更新します。</p>
      </div>
      <div class="side-card tip">
        <h3>ヒント</h3>
        <ul>
          <li>太字・斜体・下線・マーカー・サイズ・色が使えます</li>
          <li>好きな色は「短文」または「カラー」タブで指定</li>
          <li>CSSで使える色は個人ページの基調色になります</li>
        </ul>
      </div>
    </aside>

    <section class="editor-form-wrap">
      <form id="form-member" class="cms-form hidden" data-type="member">
        <fieldset class="form-block">
          <legend>自己概要</legend>
          <label class="field"><span>クラス</span><select id="m-class"></select></label>
          <label class="field"><span>所属グループ</span><select id="m-group"></select></label>
          <div class="field color-mode">
            <span class="field-caption">好きな色</span>
            <div class="mode-picks" role="radiogroup" aria-label="好きな色の指定方法">
              <label class="mode-pick">
                <input type="radio" name="color-mode" value="text" id="color-mode-text" checked>
                <span>短文で指定</span>
              </label>
              <label class="mode-pick">
                <input type="radio" name="color-mode" value="code" id="color-mode-code">
                <span>カラーコードで指定</span>
              </label>
            </div>
            <div class="mode-panel active" data-color-panel="text">
              <input id="m-color" type="text" placeholder="例: 水色 / 赤 / サイトカラー / blue">
              <p class="muted tiny">色の名前（日本語・英語）。解決できる色はページ全体の基調色になります。</p>
            </div>
            <div class="mode-panel" data-color-panel="code" hidden>
              <div class="field-row">
                <label class="field grow"><span>カラーコード</span>
                  <input id="m-color-code" type="text" placeholder="#22d3ee / rgb(34,211,238) / hsl(190,90%,50%)">
                </label>
                <label class="field color-field"><span>ピッカー</span>
                  <input id="m-color-hex" type="color" value="#2ec4b6">
                </label>
              </div>
              <p class="muted tiny">コードまたはピッカーで選んだ色が基調色になります（短文欄は使いません）。</p>
            </div>
            <div class="theme-preview" id="theme-preview" hidden>
              <span class="theme-preview-swatch" id="theme-preview-swatch"></span>
              <span class="muted tiny">基調色プレビュー: <code id="theme-preview-hex">—</code></span>
            </div>
          </div>
        </fieldset>
