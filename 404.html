<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - 遊びの座標が消滅しました | Asobi Lab.</title>
  <script src="/asobiseminar/js/setThemeColor.js"></script>
  <script src="/asobiseminar/js/load-css.js"></script>
  <link rel="stylesheet" href="/asobiseminar/css/404.css">
</head>
<body>
  <canvas id="playCanvas" aria-hidden="true"></canvas>

  <main class="error-stage" id="stage">
    <div class="error-core" id="core">
      <p class="error-code" id="errorCode" title="クリックしてみて">404</p>
      <h1 class="error-title" id="errorTitle">遊びの座標が消滅しました</h1>
      <p class="error-message" id="errorMessage">
        このページは遊びすぎて、時空の隙間に落ちてしまったようです。
      </p>

      <div class="error-actions">
        <button type="button" class="error-btn secondary" id="rerollBtn">
          もう一度探す
        </button>
        <a href="/asobiseminar/index.html" class="error-btn">
          ➔ ホームに戻る
        </a>
        <a href="/asobiseminar/sitemap.html" class="error-btn secondary">
          サイトマップ
        </a>
      </div>

      <p class="error-hint" id="errorHint">
        画面を触ったり、404をクリックしたりしてみてください
      </p>

      <div class="score-board" id="scoreBoard" hidden>
        <span>捕まえた遊び: <strong id="catchCount">0</strong></span>
      </div>
    </div>

    <!-- 捕まえられる浮遊オブジェクト用コンテナ -->
    <div class="play-objects" id="playObjects" aria-hidden="true"></div>
  </main>

  <script src="/asobiseminar/js/404.js"></script>
</body>
</html>
